[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zoom-coach"
version = "0.1.0"
description = "Live call coach: follows your call transcript and suggests how to steer it, using Claude."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
audio = ["faster-whisper>=1.0", "sounddevice>=0.4", "numpy>=1.24"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
zoom-coach = "zoom_coach.__main__:main"

[tool.setuptools]
packages = ["zoom_coach", "zoom_coach.sources"]

[tool.setuptools.package-data]
zoom_coach = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
